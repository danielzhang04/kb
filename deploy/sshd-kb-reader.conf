# kb-reader sftp deny - ruling 4e5f6071-92a3b4c5 (approved 2026-09-17).
#
# Installed at /etc/ssh/sshd_config.d/kb-reader.conf by
# vm-preflight-prod.ps1 -Step sshd-reader-deny (tooling/vm-preflight-prod.ps1, kb-rehearsal).
#
# `Subsystem` is NOT one of the keywords permitted inside a `Match` block (sshd_config(5) MATCH),
# so a per-user SFTP deny cannot be written as a `Match User kb-reader` + `Subsystem sftp none`
# pair. Per sshd_config(5), ForceCommand "applies to shell, command, or subsystem execution", so
# pinning ForceCommand here routes an sftp subsystem request through the SAME forced command as
# every other kb-reader session. reader_shell.sh (/usr/local/lib/kb/reader_shell.sh) then refuses
# explicitly: a request whose $SSH_ORIGINAL_COMMAND names sftp-server or internal-sftp prints
# "sftp denied" and exits 1, rather than relying only on its unrecognised-command catch-all.
#
# The four forwarding/tunnel denials below are additional hardening for the same identity: none of
# them by themselves deny sftp (only ForceCommand does), but a read-only ssh identity has no
# legitimate use for any of them either.
Match User kb-reader
    ForceCommand /usr/local/lib/kb/reader_shell.sh
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    AllowAgentForwarding no
