<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>kb Mission Control</title>
    <!-- PWA (D0.10): installable standalone shell. theme-color matches --bg-base, which the field-guide
         restyle (2026-08-18) moved from warm #1a1815 to neutral #0f0f0f. public/manifest.test.ts reads
         the token out of app.css and asserts both this meta and the manifest agree with it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS Add-to-Home-Screen (no auto-install prompt): standalone + home-screen icon + title. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="kb Control" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
