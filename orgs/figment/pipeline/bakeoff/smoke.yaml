{
  "gpu": {
    "type": "NVIDIA GeForce RTX 4090",
    "count": 1,
    "cloud": "SECURE"
  },
  "price_usd_per_hour": 0.8,
  "max_minutes": 25,
  "container_disk_gb": 60,
  "volume_gb": 60,
  "volume_mount_path": "/workspace",
  "image": "runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04",
  "comfyui": {
    "root": "/workspace/ComfyUI",
    "git_ref": "v0.20.1",
    "port": 8188,
    "start_command": "python main.py"
  },
  "readiness_timeout_seconds": 1200,
  "job_timeout_seconds": 900,
  "models": [
    {
      "repo_id": "Comfy-Org/flux2-klein-4B",
      "filename": "split_files/diffusion_models/flux-2-klein-base-4b.safetensors",
      "destination_dir": "/workspace/ComfyUI/models/diffusion_models"
