        "sampler": [
          "10",
          0
        ],
        "sigmas": [
          "9",
          0
        ],
        "latent_image": [
          "6",
          0
        ]
      }
    },
    "12": {
      "class_type": "VAEDecode",
      "inputs": {
        "samples": [
          "11",
          0
        ],
        "vae": [
          "3",
          0
        ]
      }
    },
    "13": {
      "class_type": "SaveImage",
      "inputs": {
        "filename_prefix": "placeholder",
        "images": [
          "12",
          0
        ]
      }
    }
  },
