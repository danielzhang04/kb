        "model": [
          "1",
          0
        ],
        "clip": [
          "2",
          0
        ]
      }
    },
    "5": {
      "class_type": "CLIPTextEncode",
      "inputs": {
        "text": "Close-up portrait photograph of an adult woman in her mid twenties, shoulders up, facing the camera, neutral relaxed expression with a faint smile. Natural skin texture with visible pores and fine flyaway hairs, no retouching. She wears a plain fitted black crew-neck top. Soft even daylight from a window camera-left, plain warm off-white wall behind her, shallow depth of field, shot on a phone camera.",
        "clip": [
          "4",
          1
        ]
      }
    },
    "6": {
      "class_type": "ConditioningZeroOut",
      "inputs": {
        "conditioning": [
          "5",
          0
        ]
      }
    },
    "7": {
      "class_type": "EmptyLatentImage",
      "inputs": {
        "width": 1448,
        "height": 2176,
        "batch_size": 1
      }
    },
    "8": {
      "class_type": "KSampler",
      "inputs": {
        "seed": 1595,
        "steps": 4,
        "cfg": 1.0,
        "sampler_name": "res_2s",
        "scheduler": "beta",
        "denoise": 1.0,
        "model": [
          "4",
          0
        ],
        "positive": [
          "5",
          0
        ],
        "negative": [
          "6",
          0
        ],
        "latent_image": [
          "7",
          0
        ]
      }
    },
    "9": {
      "class_type": "VAEDecode",
      "inputs": {
        "samples": [
          "8",
          0
        ],
        "vae": [
          "3",
          0
        ]
      }
    },
    "10": {
      "class_type": "SaveImage",
      "inputs": {
        "filename_prefix": "creator-001-tensor-tester",
        "images": [
          "9",
          0
        ]
      }
    }
  },
  "seed_fields": [
    "seed",
    "noise_seed"
  ],
  "uploads": [
    {
      "files": [
        "out/creator-001-tensor-train/*.safetensors"
      ],
      "subfolder": "creator001krea2",
      "type": "input",
      "overwrite": true,
      "chunk_bytes": 16777216
    }
  ],
