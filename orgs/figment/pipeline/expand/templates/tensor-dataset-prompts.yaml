    "note": "Their two CR Prompt List nodes each hold prepend_text + 15 multiline rows (start_index 0, max_rows 15, append_text empty). The node concatenates prepend_text + row and emits a STRING list, so one graph run fans out to 15 face images and 15 body images. Our harness has no list-fanout node: the 15 rows become 15 jobs, each job substituting prepend + row into TextEncodeQwenImageEditPlus. Identical result, identical order.",
    "prepend_is_the_hand_typed_description": "The lesson's own rule (module 10 @3:59-4:21): the stock prepend ships mismatched to the input photo and MUST be rewritten to match it. face.identity matches anchors/g01.jpg; body.identity matches anchors/g07.jpg.",
    "identity_also_drives_the_refine_pass": "Their SetNode/GetNode pair routes the same prepend string to the FLUX.2 refine CLIPTextEncode (nodes 800 / 780). Ours bakes it into the graph at those same node ids; only the two Qwen-edit prompts vary per job.",
    "register_source": "pipeline/look-spec-v2.md section 0 (operator taste anchor, 2026-09-03) supplies the makeup/skin/hair/jewellery slot words. Section 4a banned phrases and section 4c age phrasing are binding: no banned literal appears anywhere in this file, and age is stated as a life stage with adult physical markers, never as a numeral.",
    "quotation": "Only the short angle/pose/lighting phrases are carried over from the package. Their anatomical and wardrobe language is dropped; wardrobe lives in body.identity, drawn from persona.yaml grammar.wardrobe_families (corset-bustier).",
    "framing_field": "Track-2 Task B1 (D24): identity-spec.md's 'Rule for expansion' finding -- a full-frame body swap comes out mask-like when the face is small in the rendered cell. body.rows entries are now {\"text\", \"framing\"}: \"half\" rows are reworded to frame no wider than mid-thigh so the face stays large; \"full\" rows keep the package's own wide/low-angle/walking framings and route to the fullbody manifest's face-repair second pass instead (tensor_dataset_fullbody_api.json). face.rows are always close framings already and stay plain strings.",
    "fullbody_repair_prompt_note": "Track-2 Task B1 (D25): node 952's TextEncodeQwenImageEditPlus prompt on the fullbody workflow's face-repair tail (top-level fullbody_repair_prompt) is the same fixed instruction for every 'full'-framed job -- it is a detail-restoration touch-up on a tight face crop, not a scene description, so it does not vary by row the way face/body.identity + row do. Same style as anchor-prompts.yaml's edit.constraint_clause."
  },
